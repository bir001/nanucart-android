name: Build Nanucart APK
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Your Nanucart website URL (end with /)"
        required: true
        default: "https://bir001.github.io/nanucart/"
  push:
    paths:
      - "android-src.zip"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Unpack project
        run: unzip -q android-src.zip -d src
      - name: Build APK
        working-directory: src
        run: gradle assembleRelease --no-daemon -PsiteUrl="${{ inputs.site_url || 'https://bir001.github.io/nanucart/' }}" -PverCode=${{ github.run_number }}
      - name: Name the APK
        run: cp src/app/build/outputs/apk/release/*.apk NanuCart.apk
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Nanu Cart APK ${{ github.run_number }}
          make_latest: true
          files: NanuCart.apk
